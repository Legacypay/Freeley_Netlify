[build]
  command = "npm install && node build_blog.js"
  publish = "."

[build.processing]
  # Enable pretty URLs — strips .html from URLs
  # /weight-loss.html → serves at /weight-loss
  skip = false

[build.processing.html]
  pretty_urls = true

[functions]
  directory = "netlify/functions"

# ── Scheduled Functions ────────────────────────────────────────
# Retry failed MDI case submissions every 15 minutes
[functions."retryPendingCases"]
  schedule = "*/15 * * * *"

# ── MD Integrations Environment Variables ──────────────────────
# Set these in Netlify Dashboard > Site Settings > Environment Variables:
#
#   MDI_CLIENT_ID              - Partner Client ID from MD Integrations
#   MDI_CLIENT_SECRET          - Partner Client Secret (keep safe!)
#   MDI_BASE_URL               - API base URL (default: https://api.mdintegrations.com)
#   MDI_WEBHOOK_SECRET         - Secret for verifying incoming MDI webhooks
#   MDI_DEFAULT_PHARMACY_ID    - Default 503A compounding pharmacy ID
#   N8N_WEBHOOK_URL            - Your n8n/Make/Zapier webhook for notifications

# ── REDIRECTS ──────────────────────────────────────────────────
# 301 redirect .html URLs to clean URLs to prevent duplicate content
# This fixes the "Alternate page with proper canonical tag" error
# in Google Search Console.

# Force .html → clean URL (301 permanent redirect)
[[redirects]]
  from = "/*.html"
  to = "/:splat"
  status = 301
  force = true

# Remove trailing slashes (prevent /page/ vs /page duplicates)
[[redirects]]
  from = "/*/"
  to = "/:splat"
  status = 301
  force = false

# ── Cache-Control Headers ──────────────────────────────────
# Ensures browsers always revalidate with Netlify instead of
# serving stale cached content after deployments.

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Robots-Tag = "index, follow"
    # Security headers — required for enterprise/LegitScript compliance
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Content Security Policy — restricts where scripts/styles/etc can come from.
    # 'unsafe-inline' is required because the site has inline <script> and
    # inline onclick handlers throughout. Tightening to nonces/hashes is a
    # future cleanup. Allowlist covers Stripe, Firebase, MDI, analytics, fonts.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://js.stripe.com https://www.googletagmanager.com https://www.google-analytics.com https://connect.facebook.net https://widget.trustpilot.com https://*.gstatic.com https://www.gstatic.com https://apis.google.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://www.clarity.ms https://*.clarity.ms; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://api.stripe.com https://api.mdintegrations.com https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com https://*.cloudfunctions.net wss://*.firebaseio.com https://www.google-analytics.com https://www.googletagmanager.com https://*.facebook.com https://widget.trustpilot.com https://www.clarity.ms https://*.clarity.ms; frame-src https://js.stripe.com https://hooks.stripe.com https://*.stripe.com https://*.mdintegrations.com https://*.firebaseapp.com https://widget.trustpilot.com https://*.trustpilot.com; worker-src 'self' blob:; base-uri 'self'; object-src 'none'; form-action 'self' https://*.stripe.com; frame-ancestors 'none'; upgrade-insecure-requests"

# Tighten cache for HTML — short TTL so pricing/copy changes ship fast.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
