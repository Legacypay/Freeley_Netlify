[build]
  # 2026-07-17 Astro migration: now builds the Astro site (src/) instead of
  # the old static root. Legacy pages (130+ blog posts, about/contact/etc
  # with no Astro equivalent yet) were copied as-is into public/ — Astro
  # passes through public/ untouched, so they keep serving at their exact
  # original URLs. KNOWN GAP: build_blog.js (regenerates blog HTML from
  # content/blog/*.md) is not wired into this build yet — new/edited blog
  # posts need manual re-sync into public/ until that's automated.
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[build.processing]
  # Enable pretty URLs — strips .html from URLs
  # /weight-loss.html → serves at /weight-loss
  skip = false

[build.processing.html]
  pretty_urls = true

[functions]
  directory = "netlify/functions"

# ── Scheduled Functions ────────────────────────────────────────
# Retry failed MDI case submissions every 15 minutes
[functions."retryPendingCases"]
  schedule = "*/15 * * * *"

# Ping Supabase daily so the free-tier project never auto-pauses (7-day idle limit)
[functions."keepSupabaseAlive"]
  schedule = "@daily"

# ── MD Integrations Environment Variables ──────────────────────
# Set these in Netlify Dashboard > Site Settings > Environment Variables:
#
#   MDI_CLIENT_ID              - Partner Client ID from MD Integrations
#   MDI_CLIENT_SECRET          - Partner Client Secret (keep safe!)
#   MDI_BASE_URL               - API base URL (default: https://api.mdintegrations.com)
#   MDI_WEBHOOK_SECRET         - Secret for verifying incoming MDI webhooks
#   MDI_DEFAULT_PHARMACY_ID    - Default 503A compounding pharmacy ID
#   N8N_WEBHOOK_URL            - Your n8n/Make/Zapier webhook for notifications

# ── REDIRECTS ──────────────────────────────────────────────────
# 301 redirect .html URLs to clean URLs to prevent duplicate content
# This fixes the "Alternate page with proper canonical tag" error
# in Google Search Console.

# ══════════════════════════════════════════════════════════════
# COMING SOON GATE  —  TEMPORARY "under construction" waitlist
# ══════════════════════════════════════════════════════════════
# This block makes EVERY URL render the waitlist page while keeping
# the URL in the address bar (200 rewrite, not a redirect). No real
# route (/pricing, /checkout, blog, etc.) is reachable while it's here.
#
# The allow-rules below run FIRST (Netlify: first matching rule wins),
# so assets (/_astro), Netlify Functions/webhooks (/.netlify) and the
# favicons still load. Everything else falls through to the forced
# rewrite at the bottom. `force = true` is what makes it override even
# pages that really exist — without it, /pricing would still open.
#
# ┌──────────────────────────────────────────────────────────────┐
# │ AI AGENT / DEV: HOW TO REMOVE THE WAITLIST (restore the site) │
# │ 1. Delete THIS ENTIRE block — from the top banner above down  │
# │    to the "END COMING SOON GATE" line below. That's the only  │
# │    required step; it instantly restores full-site routing.    │
# │ 2. Do NOT touch any other [[redirects]] rule in this file —   │
# │    the .html→clean-URL and trailing-slash rules must stay.    │
# │ 3. KEEP these (they're harmless / reusable, not the gate):    │
# │      • src/lib/supabaseClient.ts  (generic Supabase helper)   │
# │      • supabase/migrations/0002_waitlist.sql  + the waitlist  │
# │        table — it holds REAL collected emails. Never drop it. │
# │ 4. OPTIONAL: delete src/pages/waitlist.astro only if you no   │
# │    longer want a /waitlist page to exist.                     │
# │ 5. Redeploy. Full details: see WAITLIST.md at the repo root.  │
# └──────────────────────────────────────────────────────────────┘
[[redirects]]
  from = "/_astro/*"
  to = "/_astro/:splat"
  status = 200

[[redirects]]
  from = "/.netlify/*"
  to = "/.netlify/:splat"
  status = 200

[[redirects]]
  from = "/favicon.svg"
  to = "/favicon.svg"
  status = 200

[[redirects]]
  from = "/favicon.png"
  to = "/favicon.png"
  status = 200

# Static assets (images/fonts/etc) must load on the waitlist page — they
# expose no real page, only files. Safe to let through.
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

# Legacy site-wide CSS/JS, loaded via absolute paths from Layout.astro and
# several pages (weight-loss, longevity, hair-loss, etc). Without these the
# catch-all below answers /global.css, /style/style.css and /style/script.js
# with the waitlist HTML, which the browser then rejects for MIME mismatch.
[[redirects]]
  from = "/global.css"
  to = "/global.css"
  status = 200

[[redirects]]
  from = "/style/*"
  to = "/style/:splat"
  status = 200

# Product card images on /pricing (image-18.png etc.) and the assessment
# quiz's inline script — same absolute-path problem as above.
[[redirects]]
  from = "/products-imgs/*"
  to = "/products-imgs/:splat"
  status = 200

[[redirects]]
  from = "/quiz-scripts/*"
  to = "/quiz-scripts/:splat"
  status = 200

[[redirects]]
  from = "/waitlist"
  to = "/waitlist"
  status = 200

# Client preview of the redesigned landing. /prototype was promoted to be
# index.astro itself (2026-07-31), so /preview is now just a shareable, noindex
# alias for the live homepage. /preview/* allows browsing any page under
# /preview/[route].
[[redirects]]
  from = "/preview"
  to = "/"
  status = 200

[[redirects]]
  from = "/preview/*"
  to = "/:splat"
  status = 200

# The full comparison table, linked from the capsule on /preview. Without this
# pass-through the forced catch-all below answers it with the waitlist HTML and
# the button appears broken. Remove along with the gate, like /preview.
[[redirects]]
  from = "/compare"
  to = "/compare"
  status = 200

# The assessment quiz. /preview opens it in a modal <iframe>, so without this
# rule the catch-all answers the iframe with the waitlist page and every CTA on
# the mockup looks broken — including the modal itself. The quiz is also the
# no-JS fallback target for those same links.
[[redirects]]
  from = "/assessment-quiz"
  to = "/assessment-quiz"
  status = 200

# Redesigned routes, live behind the gate on request (2026-08-03): partner
# pharmacies + the 4 legal pages, all now on the real .wl- design system.
[[redirects]]
  from = "/partner-pharmacies"
  to = "/partner-pharmacies"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms"
  status = 200

[[redirects]]
  from = "/hipaa"
  to = "/hipaa"
  status = 200

[[redirects]]
  from = "/telehealth-consent"
  to = "/telehealth-consent"
  status = 200

# Astro dev-server paths — only ever requested by Netlify Preview Servers,
# which run `astro dev` instead of a production build. Vite serves modules
# straight off the project root, so the browser asks for paths that simply do
# not exist in a built site. Without these rules the forced catch-all below
# swallows them and answers with the waitlist HTML, which breaks images, HMR
# and the page's own inline scripts. All inert on freeley.com — none of these
# paths exist in the build.
#
#   /_image        <Image> component in dev (a build emits /_astro/*, above)
#   /src/*         page + component source, e.g. the waitlist inline <script>
#                  is fetched as /src/pages/waitlist.astro?astro&type=script
#   /@vite, /@id   Vite HMR client and resolved bare imports
#   /@fs           files outside the project root
#   /node_modules  pre-bundled dependencies
[[redirects]]
  from = "/_image"
  to = "/_image"
  status = 200

[[redirects]]
  from = "/src/*"
  to = "/src/:splat"
  status = 200

[[redirects]]
  from = "/@vite/*"
  to = "/@vite/:splat"
  status = 200

[[redirects]]
  from = "/@fs/*"
  to = "/@fs/:splat"
  status = 200

[[redirects]]
  from = "/@id/*"
  to = "/@id/:splat"
  status = 200

[[redirects]]
  from = "/node_modules/*"
  to = "/node_modules/:splat"
  status = 200

# Forced 200 rewrite: serve the waitlist HTML at every remaining URL
# WITHOUT changing the address bar. Change to `status = 302` if you'd
# rather redirect visitors to freeley.com/waitlist instead.
[[redirects]]
  from = "/*"
  to = "/waitlist"
  status = 200
  force = true
# ══════════════════════════════════════════════════════════════
# END COMING SOON GATE
# ══════════════════════════════════════════════════════════════

# Force .html → clean URL (301 permanent redirect)
[[redirects]]
  from = "/*.html"
  to = "/:splat"
  status = 301
  force = true

# Remove trailing slashes (prevent /page/ vs /page duplicates)
[[redirects]]
  from = "/*/"
  to = "/:splat"
  status = 301
  force = false

# ── Cache-Control Headers ──────────────────────────────────
# Ensures browsers always revalidate with Netlify instead of
# serving stale cached content after deployments.

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Robots-Tag = "index, follow"
    # Security headers — required for enterprise/LegitScript compliance
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Content Security Policy — restricts where scripts/styles/etc can come from.
    # 'unsafe-inline' is required because the site has inline <script> and
    # inline onclick handlers throughout. Tightening to nonces/hashes is a
    # future cleanup. Allowlist covers Stripe, Firebase, MDI, analytics, fonts.
    # 2026-07-17: added Supabase (new lead-capture DB + patient-hub auth) and
    # Tawk.to (chat widget used on the Astro pages — legacy pages still use
    # Tidio, both allowlisted until that's consolidated to one).
    # 2026-07-28: added t.whop.tw (Whop conversion pixel). It needs BOTH
    # script-src (it loads t.whop.tw/s.js) and connect-src (s.js beacons
    # events back to the same origin) — script-src alone looks like it works
    # and then drops every event.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://js.stripe.com https://www.googletagmanager.com https://www.google-analytics.com https://connect.facebook.net https://widget.trustpilot.com https://*.gstatic.com https://www.gstatic.com https://apis.google.com https://accounts.google.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://www.clarity.ms https://*.clarity.ms https://code.tidio.co https://*.tidio.co https://*.tidiochat.com https://embed.tawk.to https://*.tawk.to https://t.whop.tw; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://*.tidio.co https://*.tidiochat.com https://*.tawk.to; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://*.tidio.co https://*.tidiochat.com https://*.tawk.to data:; img-src 'self' data: blob: https:; connect-src 'self' https://cdn.jsdelivr.net https://api.stripe.com https://api.mdintegrations.com https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com https://*.cloudfunctions.net wss://*.firebaseio.com https://www.gstatic.com https://*.gstatic.com https://apis.google.com https://accounts.google.com https://www.google-analytics.com https://www.googletagmanager.com https://*.facebook.com https://widget.trustpilot.com https://www.clarity.ms https://*.clarity.ms https://*.tidio.co https://*.tidiochat.com wss://*.tidio.co wss://*.tidiochat.com https://*.supabase.co wss://*.supabase.co https://*.tawk.to wss://*.tawk.to https://t.whop.tw; frame-src 'self' https://js.stripe.com https://hooks.stripe.com https://*.stripe.com https://*.mdintegrations.com https://*.firebaseapp.com https://*.firebaseauth.com https://accounts.google.com https://content.googleapis.com https://widget.trustpilot.com https://*.trustpilot.com https://*.tidio.co https://*.tidiochat.com; worker-src 'self' blob:; base-uri 'self'; object-src 'none'; form-action 'self' https://accounts.google.com https://*.firebaseapp.com https://*.stripe.com; frame-ancestors 'self'; upgrade-insecure-requests"

# Tighten cache for HTML — short TTL so pricing/copy changes ship fast.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Astro build output — JS, CSS, optimized images, and the self-hosted font
# files (/_astro/fonts/*.woff2). Every filename carries a content hash, so a
# changed file gets a NEW URL: safe to cache forever. Without this rule these
# fall through to the site-wide "must-revalidate" above and get re-validated
# on every page view. The gate's /_astro/* allow-rule already lets them past
# the waitlist catch-all.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The /preview mockup & sub-pages must never be indexed. More specific than the site-wide
# "/*" rule above, which sets "index, follow" for the real pages.
[[headers]]
  for = "/preview"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/preview/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"


# Same for the comparison page it links to — part of the same mockup.
[[headers]]
  for = "/compare"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

