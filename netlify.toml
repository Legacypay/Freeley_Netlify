[dev]
  # This Astro CLI version daemonizes `astro dev` (it starts the server and
  # immediately exits 0), which `netlify dev`'s default framework-detection
  # misreads as "the process died," shutting the whole dev session down right
  # after it comes up. framework = "#custom" with no `command` tells it to
  # skip spawning anything and just proxy whatever is already listening on
  # targetPort — run `npm run dev` yourself first, then `npm run dev:netlify`.
  framework = "#custom"
  targetPort = 4321
  # A harmless placeholder process — Netlify Dev needs *a* long-running
  # child to watch, but the real server is the already-running `astro dev`
  # daemon on targetPort above.
  command = "node scripts/dev-noop.js"

[build]
  # 2026-07-17 Astro migration: now builds the Astro site (src/) instead of
  # the old static root. Legacy pages (130+ blog posts, about/contact/etc
  # with no Astro equivalent yet) were copied as-is into public/ — Astro
  # passes through public/ untouched, so they keep serving at their exact
  # original URLs. KNOWN GAP: build_blog.js (regenerates blog HTML from
  # content/blog/*.md) is not wired into this build yet — new/edited blog
  # posts need manual re-sync into public/ until that's automated.
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[build.processing]
  # Enable pretty URLs — strips .html from URLs
  # /weight-loss.html → serves at /weight-loss
  skip = false

[build.processing.html]
  pretty_urls = true

[functions]
  directory = "netlify/functions"

# ── Scheduled Functions ────────────────────────────────────────
# Retry failed MDI case submissions every 15 minutes
[functions."retryPendingCases"]
  schedule = "*/15 * * * *"

# Alert the team about MDI cases flagged is_additional_approval_needed (doctor
# requested a treatment/titration change — see MDI's go-live guidance)
[functions."checkAdditionalApprovals"]
  schedule = "0 * * * *"

# Ping Supabase daily so the free-tier project never auto-pauses (7-day idle limit)
[functions."keepSupabaseAlive"]
  schedule = "@daily"

# ── Authorize.Net Environment Variables (lib/authnet-config.js) ──
#   AUTHNET_ENV                      - "sandbox" | "production" — selects the credential set AND the host
#   AUTHNET_SANDBOX_API_LOGIN_ID     - sandbox.authorize.net → Account → API Credentials & Keys
#   AUTHNET_SANDBOX_TRANSACTION_KEY  - SECRET (16 chars). Sandbox and live keys are NOT interchangeable
#   AUTHNET_SANDBOX_CLIENT_KEY       - Public Client Key for Accept.js (browser tokenization)
#   AUTHNET_SANDBOX_SIGNATURE_KEY    - webhook Signature Key for the sandbox Merchant Interface
#   AUTHNET_LIVE_API_LOGIN_ID / AUTHNET_LIVE_TRANSACTION_KEY / AUTHNET_LIVE_CLIENT_KEY / AUTHNET_LIVE_SIGNATURE_KEY
#                                    - same four for the real merchant account (account.authorize.net)
#   AUTHNET_API_LOGIN_ID / AUTHNET_TRANSACTION_KEY / AUTHNET_CLIENT_KEY / AUTHNET_SIGNATURE_KEY
#                                    - legacy un-prefixed fallbacks, used when the prefixed one is unset
#   AUTHNET_SIMULATE                 - "true" = approve checkout WITHOUT charging (no Authorize.Net call).
#                                      Test-only bypass — must be deleted before real launch
#
# ── MD Integrations Environment Variables ──────────────────────
# Set these in Netlify Dashboard > Site Settings > Environment Variables:
#
#   MDI_CLIENT_ID              - Partner Client ID from MD Integrations
#   MDI_CLIENT_SECRET          - Partner Client Secret (keep safe!)
#   MDI_BASE_URL               - API base URL (default: https://api.mdintegrations.com)
#   MDI_WEBHOOK_SECRET         - Secret for verifying incoming MDI webhooks
#   MDI_DEFAULT_PHARMACY_ID    - Default 503A compounding pharmacy ID
#   MDI_LIVE_MODE              - "true" once partner is Active (sends live environment_id)
#   MDI_ALLOW_LIVE_ORDERS      - "true" to permit un-tagged LIVE vouchers. Unset = every voucher
#                                is a TEST voucher (demo:true + "TEST CASE" metadata). See docs/MDI_TESTING.md
#   MDI_FORCE_TEST             - "true" = kill switch, force test mode
#   MDI_TEST_EMAIL_PATTERNS    - comma-separated email substrings that are always test orders
#   MDI_TEST_FULL_FLOW         - "true" = test orders create a real (tagged) case instead of a demo voucher
#   MDI_SEND_ENVIRONMENT_ID    - "false" to stop sending the undocumented environment_id field
#   MDI_DEBUG_LOG_RESPONSES    - "true" to log full MDI voucher responses (may contain PHI — keep off)
#   MDI_PARTNER_ID             - Partner ID (logging only, not sent to MDI's API — used by submitQuiz.js)
#   MDI_SANDBOX_ENV_ID         - MDI environment_id sent for sandbox/test vouchers
#   MDI_LIVE_ENV_ID            - MDI environment_id sent for live vouchers
#   MDI_TEST_TAG_KEY/NAME/COLOR - override the "test-case" MDI tag definition (lib/mdi-tags.js)
#   MDI_APPROVAL_CHECK_STATUSES - comma-separated case statuses checkAdditionalApprovals.js scans
#                                 (default: "Assigned,Waiting")
#   N8N_WEBHOOK_URL            - Your n8n/Make/Zapier webhook for notifications

# ── REDIRECTS ──────────────────────────────────────────────────
# 301 redirect .html URLs to clean URLs to prevent duplicate content
# This fixes the "Alternate page with proper canonical tag" error
# in Google Search Console.


# Force .html → clean URL (301 permanent redirect)
[[redirects]]
  from = "/*.html"
  to = "/:splat"
  status = 301
  force = true

# Remove trailing slashes (prevent /page/ vs /page duplicates)
[[redirects]]
  from = "/*/"
  to = "/:splat"
  status = 301
  force = false

# ── Cache-Control Headers ──────────────────────────────────
# Ensures browsers always revalidate with Netlify instead of
# serving stale cached content after deployments.

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Robots-Tag = "index, follow"
    # Security headers — required for enterprise/LegitScript compliance
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Content Security Policy — restricts where scripts/styles/etc can come from.
    # 'unsafe-inline' is required because the site has inline <script> and
    # inline onclick handlers throughout. Tightening to nonces/hashes is a
    # future cleanup. Allowlist covers Stripe, Firebase, MDI, analytics, fonts.
    # 2026-07-17: added Supabase (new lead-capture DB + patient-hub auth).
    # Legacy .html pages still use Tidio for chat — Tawk.to (used on the
    # Astro pages) was removed site-wide 2026-08-14.
    # 2026-07-28: added t.whop.tw (Whop conversion pixel). It needs BOTH
    # script-src (it loads t.whop.tw/s.js) and connect-src (s.js beacons
    # events back to the same origin) — script-src alone looks like it works
    # and then drops every event.
    # 2026-08-27: added Authorize.Net (Accept.js card tokenization on
    # checkout.astro). Same two-list rule as Whop: js.authorize.net loads
    # the Accept.js script (script-src), which then makes its own XHR to
    # api2.authorize.net to tokenize the card (connect-src) — api.authorize.net
    # and the jstest/api2test sandbox hosts are included for parity/testing.
    # 2026-08-31: GA4's gtag.js beacons page_view/events to analytics.google.com
    # (its current collect endpoint) with a www.google.com fallback (`gaf=1`,
    # used when ad-signal/consent params are present) — neither was in
    # connect-src, so every GA4 hit was silently blocked and dropped despite
    # googletagmanager.com/google-analytics.com (the OLD universal-analytics
    # domains, still used for the initial config request) being allowed.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://js.stripe.com https://www.googletagmanager.com https://www.google-analytics.com https://connect.facebook.net https://widget.trustpilot.com https://*.gstatic.com https://www.gstatic.com https://apis.google.com https://accounts.google.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://www.clarity.ms https://*.clarity.ms https://code.tidio.co https://*.tidio.co https://*.tidiochat.com https://t.whop.tw https://js.authorize.net https://jstest.authorize.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://*.tidio.co https://*.tidiochat.com; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://*.tidio.co https://*.tidiochat.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://cdn.jsdelivr.net https://api.stripe.com https://api.mdintegrations.com https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com https://*.cloudfunctions.net wss://*.firebaseio.com https://www.gstatic.com https://*.gstatic.com https://apis.google.com https://accounts.google.com https://www.google-analytics.com https://analytics.google.com https://www.googletagmanager.com https://www.google.com https://*.facebook.com https://widget.trustpilot.com https://www.clarity.ms https://*.clarity.ms https://*.tidio.co https://*.tidiochat.com wss://*.tidio.co wss://*.tidiochat.com https://*.supabase.co wss://*.supabase.co https://t.whop.tw https://api.authorize.net https://api2.authorize.net https://apitest.authorize.net https://api2test.authorize.net; frame-src 'self' https://js.stripe.com https://hooks.stripe.com https://*.stripe.com https://*.mdintegrations.com https://*.firebaseapp.com https://*.firebaseauth.com https://accounts.google.com https://content.googleapis.com https://widget.trustpilot.com https://*.trustpilot.com https://*.tidio.co https://*.tidiochat.com; worker-src 'self' blob:; base-uri 'self'; object-src 'none'; form-action 'self' https://accounts.google.com https://*.firebaseapp.com https://*.stripe.com; frame-ancestors 'self'; upgrade-insecure-requests"

# Tighten cache for HTML — short TTL so pricing/copy changes ship fast.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# /assets/* filenames carry NO content hash and get overwritten in place on
# every image/script fix — a year-long immutable cache here meant browsers
# kept stale galleries indefinitely (2026-08-20: client kept seeing the old
# teal Olympus slides after the fix shipped). must-revalidate + Netlify's
# ETags means cheap 304s and instant propagation of asset updates.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Astro build output — JS, CSS, optimized images, and the self-hosted font
# files (/_astro/fonts/*.woff2). Every filename carries a content hash, so a
# changed file gets a NEW URL: safe to cache forever. Without this rule these
# fall through to the site-wide "must-revalidate" above and get re-validated
# on every page view.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"


