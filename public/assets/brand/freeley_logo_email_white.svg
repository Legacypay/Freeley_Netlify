<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120">
  <!-- Reversed/knockout variant of freeley_logo_email.svg, for use on a dark
       (COLORS.green) band — same mark, colors swapped: cream circle + wordmark,
       green "F". See scripts/build-email-logo.js. -->
  <defs>
    <style>
      .wordmark { font-family: Georgia, 'Times New Roman', serif; font-weight: 700; font-size: 72px; fill: #F3EAE1; }
      .f-letter  { font-family: Georgia, 'Times New Roman', serif; font-weight: 700; font-size: 52px; fill: #1B492D; }
    </style>
  </defs>
  <circle cx="60" cy="60" r="52" fill="#F3EAE1"/>
  <text class="f-letter" x="60" y="60" text-anchor="middle" dy="0.35em">F</text>
  <text class="wordmark" x="128" y="84">Freeley</text>
</svg>
